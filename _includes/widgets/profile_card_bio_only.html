<div class="mt-3 d-md-none"></div>

<div class="row">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">

                <!-- About Me Title -->
                <div class="row px-3 pt-3">
                    <div class="col h3">
                        About Me
                    </div>
                </div>

                <div class="row p-3">
                    <div class="col">

                        <!-- Research Introduction -->
                        <div
                            class="text-profile-bio mt-0"
                            {% if site.data.profile.short_bio_text_justify %}
                                style="text-align: justify;"
                            {% endif %}
                        >
                            {{ site.data.profile.short_bio }}
                        </div>

                        <!-- Research Overview Figure -->
                        <div class="mt-3 mb-4">
                            <img
                                src="{{ '/assets/images/research/research-overview.png' | relative_url }}"
                                alt="Research overview illustrating real-world risks, proactive risk detection, and explainable decision support"
                                class="img-fluid w-100"
                                style="
                                    display: block;
                                    border-radius: 0.5rem;
                                "
                            >
                        </div>

                        <!-- Research Keywords -->
                        {% if site.data.profile.research_keywords %}
                        <div class="mt-3">
                            <strong
                                style="
                                    display: block;
                                    margin-bottom: 0.6rem;
                                "
                            >
                                Research Keywords
                            </strong>

                            <div
                                style="
                                    display: flex;
                                    flex-wrap: wrap;
                                    gap: 0.45rem;
                                "
                            >
                                {% for keyword in site.data.profile.research_keywords %}
                                <span
                                    style="
                                        display: inline-block;
                                        padding: 0.35rem 0.7rem;
                                        border: 1px solid #cbd8e6;
                                        border-radius: 0.4rem;
                                        background-color: #f4f8fc;
                                        color: #315b7d;
                                        font-size: 0.88rem;
                                        font-weight: 500;
                                    "
                                >
                                    {{ keyword }}
                                </span>
                                {% endfor %}
                            </div>
                        </div>
                        {% endif %}

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
